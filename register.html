<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>账号注册</title>
    <style>
        * {box-sizing: border-box; margin: 0; padding: 0;}
        body {
            background: #fff;
            color: #000;
            font-family: system-ui, Arial;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
        }
        .nav-bar {
            font-size: 24px;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .nav-bar a {
            color: #007bff;
            text-decoration: none;
            margin-right: 20px;
        }
        .item {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #regBtn {
            padding: 12px 30px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .tip {
            margin-top: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="forum.html">论坛</a> | <a href="register.html">注册</a>
    </div>

    <h3>账号注册</h3>
    <div class="item">
        <label>用户名</label>
        <input type="text" id="regU" placeholder="2-20位字符">
    </div>
    <div class="item">
        <label>密码</label>
        <input type="password" id="regP" placeholder="最少6位">
    </div>
    <div class="item">
        <label>确认密码</label>
        <input type="password" id="regRP" placeholder="再次输入密码">
    </div>
    <button id="regBtn" onclick="userClickReg()">立即注册</button>
    <p class="tip">同一设备/IP最多注册2个账号</p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        alert("✅ 注册页面JS加载成功");

        const SUPABASE_URL = "https://aonoebeajppbziyzucsm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_AKUMJeqzjC-LPEng6iWR_A_hMg2GT_J";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let myIp = "";

        function easyEnc(pass) {
            return window.btoa(encodeURIComponent(pass));
        }

        // 和论坛页面完全一致的IP智能获取逻辑，双页面共享同一份localStorage缓存
        async function getMyIpSmart() {
            // 1. 优先读取缓存
            const cachedIp = localStorage.getItem("cached_forum_ip");
            const cachedLocalId = localStorage.getItem("forum_fallback_local_id");
            const failedCount = Number(localStorage.getItem("ip_fetch_failed_count")) || 0;

            // 2. 有有效公网IP缓存直接复用
            if (cachedIp && !cachedIp.startsWith("local_")) {
                myIp = cachedIp;
                alert("✅ 使用缓存公网IP：" + myIp);
                alert(`🎯 本次最终生效的IP标识：${myIp}`);
                return;
            }

            // 3. 10次失败后直接复用已生成的持久化local标识
            if (cachedLocalId && failedCount >= 10) {
                myIp = cachedLocalId;
                alert("⚠️  10次获取IP失败，使用本地持久化标识：" + myIp);
                alert(`🎯 本次最终生效的IP标识：${myIp}`);
                return;
            }

            // 4. 10个接口依次尝试获取IP，每个2秒超时
            const ipApis = [
                "https://api.ipify.org?format=json",
                "https://api.my-ip.io/v2/ip.json",
                "https://ipapi.co/ip/",
                "https://api-ipv4.ip.sb/jsonip",
                "https://l2.io/ip.json",
                "https://ip.seeip.org/jsonip",
                "https://ipv4.icanhazip.com/",
                "https://ip.42.pl/raw",
                "https://v4.ident.me/.json",
                "https://ipaddr.site/json"
            ];

            for(let i = 0; i < 10; i++) {
                try {
                    alert(`🔄 第${i+1}次尝试获取公网IP...`);
                    let res = await fetch(ipApis[i], {signal: AbortSignal.timeout(2000)});
                    if(!res.ok) continue;
                    let data = await res.json();
                    if(data.ip) {
                        myIp = data.ip;
                        localStorage.setItem("cached_forum_ip", myIp);
                        localStorage.setItem("ip_fetch_failed_count", "0");
                        alert(`✅ 第${i+1}次成功获取IP：${myIp}，已存入本地缓存`);
                        alert(`🎯 本次最终生效的IP标识：${myIp}`);
                        return;
                    }
                } catch(e) {
                    console.warn(`第${i+1}次IP请求失败：`, e);
                    continue;
                }
            }

            // 5. 10次全部失败，更新失败计数
            const newFailedCount = failedCount + 1;
            localStorage.setItem("ip_fetch_failed_count", newFailedCount.toString());

            // 6. 累计第10次失败，生成永久local标识
            if(newFailedCount >= 10 && !cachedLocalId) {
                const newLocalId = "local_" + Math.random().toString(36).substring(2, 20);
                localStorage.setItem("forum_fallback_local_id", newLocalId);
                myIp = newLocalId;
                alert(`❌ 累计10次获取IP全部失败，已生成本地永久标识：${newLocalId}`);
                alert(`🎯 本次最终生效的IP标识：${myIp}`);
                return;
            } else if(cachedLocalId) {
                myIp = cachedLocalId;
                alert(`⚠️  第${newFailedCount}次获取IP失败，复用已有本地标识：${cachedLocalId}`);
                alert(`🎯 本次最终生效的IP标识：${myIp}`);
                return;
            } else {
                myIp = "temp_local_" + new Date().getTime();
                alert(`⚠️  第${newFailedCount}次获取IP失败，使用临时标识，下次打开页面继续重试`);
                alert(`🎯 本次最终生效的IP标识：${myIp}`);
            }
        }

        // 注册按钮逻辑
        window.userClickReg = async function() {
            alert("🟢 注册按钮点击成功");

            let u = document.getElementById("regU").value.trim();
            let p = document.getElementById("regP").value.trim();
            let rp = document.getElementById("regRP").value.trim();

            if(!u || !p || !rp) {
                alert("❌ 请填写完整所有字段");
                return;
            }
            if(u.length < 2 || u.length > 20) {
                alert("❌ 用户名长度不对，需2-20位");
                return;
            }
            if(p.length < 6) {
                alert("❌ 密码不能少于6位");
                return;
            }
            if(p !== rp) {
                alert("❌ 两次密码不一致");
                return;
            }

            alert("✅ 基础校验通过");

            let checkUserRes = await sb.from("lt_users").select("id").eq("username", u);
            if(checkUserRes.error) {
                alert("❌ 用户名校验出错：" + checkUserRes.error.message);
                return;
            }
            if(checkUserRes.data && checkUserRes.data.length > 0) {
                alert("❌ 这个用户名已经被注册了");
                return;
            }
            alert("✅ 用户名可用");

            let ipCheckRes = await sb.from("lt_users").select("id").eq("ip", myIp);
            if(ipCheckRes.data.length >= 2) {
                alert("❌ 当前设备/IP已经注册了2个账号，不能继续注册");
                return;
            }
            alert("✅ 账号数量校验通过");

            let encPwd = easyEnc(p);
            let insertRes = await sb.from("lt_users").insert({
                username: u,
                password: encPwd,
                ip: myIp
            });

            if(insertRes.error) {
                alert("❌ 注册写入失败：" + insertRes.error.message);
                return;
            }

            alert("🎉 注册完全成功！3秒后跳转到论坛");
            setTimeout(() => window.location.href = "forum.html", 3000);
        }

        (async function initIp() {
            await getMyIpSmart();
        })();
    </script>
</body>
</html>
