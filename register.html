<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>账号注册</title>
    <style>
        * {box-sizing: border-box; margin: 0; padding: 0;}
        body {
            background: #fff;
            color: #000;
            font-family: system-ui, Arial;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
        }
        .nav-bar {
            font-size: 24px;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .nav-bar a {
            color: #007bff;
            text-decoration: none;
            margin-right: 20px;
        }
        .item {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #regBtn {
            padding: 12px 30px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .tip {
            margin-top: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="forum.html">论坛</a> | <a href="register.html">注册</a>
    </div>

    <h3>账号注册</h3>
    <div class="item">
        <label>用户名</label>
        <input type="text" id="regU" placeholder="2-20位字符">
    </div>
    <div class="item">
        <label>密码</label>
        <input type="password" id="regP" placeholder="最少6位">
    </div>
    <div class="item">
        <label>确认密码</label>
        <input type="password" id="regRP" placeholder="再次输入密码">
    </div>
    <button id="regBtn" disabled="disabled">立即注册</button>
    <p class="tip">同一设备/IP最多注册2个账号</p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // 全局开关：页面初始化未完全完成时，完全禁止注册逻辑执行
        let pageReady = false;
        const SUPABASE_URL = "https://aonoebeajppbziyzucsm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_AKUMJeqzjC-LPEng6iWR_A_hMg2GT_J";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let myIp = "";

        function easyEnc(pass) {
            return window.btoa(encodeURIComponent(pass));
        }

        // IP智能获取逻辑
        async function getMyIpSmart() {
            const cachedIp = localStorage.getItem("cached_forum_ip");
            const cachedLocalId = localStorage.getItem("forum_fallback_local_id");
            const failedCount = Number(localStorage.getItem("ip_fetch_failed_count")) || 0;

            if (cachedLocalId && failedCount >= 10) {
                myIp = cachedLocalId;
                return;
            }

            const ipApis = [
                "https://api.ipify.org?format=json",
                "https://api.my-ip.io/v2/ip.json",
                "https://ipapi.co/ip/",
                "https://api-ipv4.ip.sb/jsonip",
                "https://l2.io/ip.json",
                "https://ip.seeip.org/jsonip",
                "https://ipv4.icanhazip.com/",
                "https://ip.42.pl/raw",
                "https://v4.ident.me/.json",
                "https://ipaddr.site/json"
            ];

            for(let i = 0; i < 10; i++) {
                try {
                    let res = await fetch(ipApis[i], {signal: AbortSignal.timeout(2000)});
                    if(!res.ok) continue;
                    let data = await res.json();
                    if(data.ip) {
                        myIp = data.ip;
                        localStorage.setItem("cached_forum_ip", myIp);
                        localStorage.setItem("ip_fetch_failed_count", "0");
                        return;
                    }
                } catch(e) {
                    continue;
                }
            }

            const newFailedCount = failedCount + 1;
            localStorage.setItem("ip_fetch_failed_count", newFailedCount.toString());

            if(newFailedCount >= 10 && !cachedLocalId) {
                const newLocalId = "local_" + Math.random().toString(36).substring(2, 20);
                localStorage.setItem("forum_fallback_local_id", newLocalId);
                myIp = newLocalId;
                return;
            } else if(cachedLocalId) {
                myIp = cachedLocalId;
                return;
            } else {
                myIp = "temp_local_" + new Date().getTime();
            }
        }

        // 注册函数，增加页面就绪状态校验
        window.userClickReg = async function(e) {
            // 双重校验：只有页面完全就绪、事件是真实的鼠标点击事件时才执行逻辑
            if(!pageReady || !e.isTrusted) {
                console.warn("拦截了非用户手动触发的点击事件");
                return;
            }

            let u = document.getElementById("regU").value.trim();
            let p = document.getElementById("regP").value.trim();
            let rp = document.getElementById("regRP").value.trim();

            if(!u || !p || !rp) {
                alert("❌ 请填写完整所有字段");
                return;
            }
            if(u.length < 2 || u.length > 20) {
                alert("❌ 用户名长度不对，需2-20位");
                return;
            }
            if(p.length < 6) {
                alert("❌ 密码不能少于6位");
                return;
            }
            if(p !== rp) {
                alert("❌ 两次密码不一致");
                return;
            }

            let checkUserRes = await sb.from("lt_users").select("id").eq("username", u);
            if(checkUserRes.error) {
                alert("❌ 用户名校验出错：" + checkUserRes.error.message);
                return;
            }
            if(checkUserRes.data && checkUserRes.data.length > 0) {
                alert("❌ 这个用户名已经被注册了");
                return;
            }

            let ipCheckRes = await sb.from("lt_users").select("id").eq("ip", myIp);
            if(ipCheckRes.data.length >= 2) {
                alert("❌ 当前设备/IP已经注册了2个账号，不能继续注册");
                return;
            }

            let encPwd = easyEnc(p);
            let insertRes = await sb.from("lt_users").insert({
                username: u,
                password: encPwd,
                ip: myIp
            });

            if(insertRes.error) {
                alert("❌ 注册写入失败：" + insertRes.error.message);
                return;
            }

            alert("🎉 注册完全成功！3秒后跳转到论坛");
            setTimeout(() => window.location.href = "forum.html", 3000);
        }

        // 页面完全加载完成后，再动态绑定点击事件、启用按钮
        document.addEventListener('DOMContentLoaded', async function() {
            await getMyIpSmart();
            // 动态绑定真实的点击事件
            document.getElementById('regBtn').addEventListener('click', userClickReg);
            // 解除按钮禁用
            document.getElementById('regBtn').disabled = false;
            document.getElementById('regBtn').innerText = "立即注册";
            // 最后把页面就绪开关打开
            pageReady = true;
        });
    </script>
</body>
</html>
